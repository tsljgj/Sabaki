<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        pointer-events: none;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const {ipcRenderer} = require('electron')
      const canvas = document.getElementById('c')
      const ctx = canvas.getContext('2d')

      function resize() {
        let dpr = window.devicePixelRatio || 1
        canvas.width = window.innerWidth * dpr
        canvas.height = window.innerHeight * dpr
        canvas.style.width = window.innerWidth + 'px'
        canvas.style.height = window.innerHeight + 'px'
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      }

      // Color = winrate lost compared to the engine's first choice
      const LEVELS = [
        {max: 0.5, color: '#1fa65a', label: '≤0.5'},
        {max: 2, color: '#8cc63f', label: '≤2'},
        {max: 5, color: '#f2b01e', label: '≤5'},
        {max: 10, color: '#ee6a2c', label: '≤10'},
        {max: Infinity, color: '#d62839', label: '>10'},
      ]
      const levelOf = (loss) => LEVELS.find((l) => loss <= l.max)

      function outlined(text, x, y, size, weight = 'bold') {
        ctx.font = `${weight} ${Math.round(size)}px -apple-system, sans-serif`
        ctx.lineJoin = 'round'
        ctx.lineWidth = Math.max(2, size * 0.22)
        ctx.strokeStyle = 'rgba(0,0,0,0.75)'
        ctx.strokeText(text, x, y)
        ctx.fillStyle = '#fff'
        ctx.fillText(text, x, y)
      }

      function compact(n) {
        return n < 1000 ? `${n}` : `${Math.round(n / 100) / 10}k`
      }

      function draw({geom, cells}) {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight)
        if (!geom || !cells) return

        // macOS may push the window below the menu bar; compensate
        let offX = window.screenX
        let offY = window.screenY
        let s = geom.spacing

        ctx.textAlign = 'center'
        ctx.textBaseline = 'middle'

        // Draw weaker moves first so the best move stays on top
        for (let cell of [...cells].reverse()) {
          let cx = geom.x - offX + cell.x * s
          let cy = geom.y - offY + cell.y * s
          let level = levelOf(cell.loss)
          let isBest = cell.rank === 1
          // Circle size = how much the engine looked at this move
          let r = s * (0.38 + 0.12 * Math.sqrt(Math.min(1, cell.visitsRatio)))

          ctx.beginPath()
          ctx.arc(cx, cy, r, 0, Math.PI * 2)
          ctx.globalAlpha = 0.88
          ctx.fillStyle = level.color
          ctx.fill()
          ctx.globalAlpha = 1
          ctx.lineWidth = isBest ? 3.5 : 1.5
          ctx.strokeStyle = isBest ? '#fff' : 'rgba(0,0,0,0.55)'
          ctx.stroke()

          outlined(cell.winrate.toFixed(1), cx, cy - s * 0.07, s * 0.34)
          let sub =
            cell.rank === 1 || cell.loss < 0.05
              ? compact(cell.visits)
              : `-${cell.loss.toFixed(1)}`
          outlined(sub, cx, cy + s * 0.2, s * 0.22, 'normal')

          // Rank badge
          let bx = cx - r * 0.78
          let by = cy - r * 0.78
          ctx.beginPath()
          ctx.arc(bx, by, s * 0.15, 0, Math.PI * 2)
          ctx.fillStyle = '#222'
          ctx.fill()
          ctx.fillStyle = '#fff'
          ctx.font = `bold ${Math.round(s * 0.2)}px -apple-system, sans-serif`
          ctx.fillText(cell.rank, bx, by + 0.5)
        }

        // Legend under the board
        let ly = geom.y - offY + (geom.size - 1) * s + s * 0.95
        let lx = geom.x - offX
        ctx.textAlign = 'left'
        ctx.font = `${Math.round(s * 0.3)}px -apple-system, sans-serif`
        ctx.fillStyle = 'rgba(0,0,0,0.7)'
        ctx.fillText('Winrate lost vs #1:', lx, ly)
        let x = lx + s * 4.6
        for (let l of LEVELS) {
          ctx.fillStyle = l.color
          ctx.beginPath()
          ctx.arc(x, ly, s * 0.16, 0, Math.PI * 2)
          ctx.fill()
          ctx.fillStyle = 'rgba(0,0,0,0.7)'
          ctx.fillText(l.label, x + s * 0.25, ly)
          x += s * 1.35
        }
      }

      window.addEventListener('resize', resize)
      resize()
      ipcRenderer.on('overlay:data', (evt, payload) => draw(payload))
    </script>
  </body>
</html>
